[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachdirect-mcp"
version = "1.0.0"
description = "MCP server for personal outreach: Brevo email, WhatsApp Web messages and an Excel contact log."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.27",
  "openpyxl>=3.1",
  "playwright>=1.40",
  "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
reachdirect = "reachdirect.server:main"

[tool.setuptools]
packages = ["reachdirect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
